# Tests run on every pull request and push. A push to main also deploys the
# portal to Azure App Service, once the repository has:
#   - variable AZURE_WEBAPP_NAME           (Settings -> Secrets and variables -> Actions -> Variables)
#   - secret   AZURE_WEBAPP_PUBLISH_PROFILE (the app's publish profile; see docs/AZURE.md)
# Until both exist the deploy job is skipped, so nothing deploys by accident.
name: Test and deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (Python version from .python-version)
        run: uv sync --frozen
      - name: Run the tests
        run: uv run pytest -q -p no:logging

  deploy:
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
